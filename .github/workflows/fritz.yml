name: Build Fritzing for macOS ARM64

on:
  workflow_dispatch:
    inputs:
      fritzing_ref:
        description: Fritzing commit or tag (default is the reviewed source commit)
        type: string
        default: 5aa56a510183c23084990a6b4481708cad24c15b
  push:
    branches: [main]
    paths: [.github/workflows/fritz.yml]

permissions:
  contents: read

concurrency:
  group: fritzing-macos-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.3
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  CMAKE_BUILD_PARALLEL_LEVEL: '3'

jobs:
  build:
    # Standard Apple Silicon runner; no self-hosted Mac or Docker required.
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Check native architecture
        id: toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          echo "sdk=$(xcrun --sdk macosx --show-sdk-version)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | tr '\n ' '--')" >> "$GITHUB_OUTPUT"

      - name: Check out Fritzing
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fritzing/fritzing-app
          ref: ${{ inputs.fritzing_ref || '5aa56a510183c23084990a6b4481708cad24c15b' }}
          path: src/fritzing-app
          persist-credentials: false

      - name: Check out matching parts snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fritzing/fritzing-parts
          ref: e64ffe973e92176b989ab390ab668638a85ee305
          path: src/fritzing-parts
          persist-credentials: false

      # Bump deps-v1 after changing dependency sources or build flags.
      # No restore-keys: never reuse binaries from a different ABI/toolchain.
      - name: Repair known Nano XML defect and validate all parts
        run: |
          set -euo pipefail
          mkdir -p dist/diagnostics
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path("src/fritzing-parts")
          path = root / "obsolete/Arduino Nano_v30.fzp"
          target = ET.parse(root / "core/Arduino Nano3(fix).fzp").getroot()
          targets = {c.attrib["id"]: c.attrib["name"]
                     for c in target.findall("./connectors/connector")}
          source = path.read_text()
          changes = []

          def normalize(name):
              return name.upper().replace("/", "").replace("+", "").replace("RST", "RESET")

          def repair(match):
              tag = match.group(0)
              values = re.findall(r' replacedby="([^"]*)"', tag)
              if len(values) < 2:
                  return tag
              connector = re.search(r' id="([^"]+)"', tag).group(1)
              name = re.search(r' name="([^"]+)"', tag).group(1)
              # Prefer a real target connector ID. RESET/GND retain the male
              # header mapping (18/19), rather than female ICSP pins (59/60).
              candidates = [v for v in values if v in targets]
              if not candidates:
                  raise SystemExit(f"No valid replacement for {connector}: {values}")
              chosen = candidates[0]
              if normalize(name) not in {normalize(targets[chosen]), normalize(targets[chosen].split("/")[0])}:
                  raise SystemExit(f"Pin mismatch: {connector} {name} -> {chosen} {targets[chosen]}")
              changes.append(f"{connector} ({name}): {values} -> {chosen}")
              tag = re.sub(r' replacedby="[^"]*"', "", tag)
              return tag[:-1] + f' replacedby="{chosen}">'

          fixed = re.sub(r"<connector\b[^>]*>", repair, source)
          if len(changes) != 30:
              raise SystemExit(f"Expected 30 known duplicate attributes, found {len(changes)}")
          ET.fromstring(fixed)
          path.write_text(fixed)
          report = Path("dist/diagnostics/parts-validation.log")
          errors = []
          files = sorted(root.rglob("*.fzp"))
          if not files:
              raise SystemExit("No part files found")
          for item in files:
              try:
                  ET.parse(item)
              except (ET.ParseError, OSError) as error:
                  errors.append(f"{item}: {error}")
          text = "\n".join(changes + [f"Validated {len(files)} part XML files"] + errors) + "\n"
          report.write_text(text)
          print(text, flush=True)
          if errors:
              raise SystemExit(f"Invalid XML in {len(errors)} part files; see parts-validation.log")
          PY

      - name: Cache Qt and compiled dependencies
        id: deps
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          key: fritzing-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-sdk${{ steps.toolchain.outputs.sdk }}-qt${{ env.QT_VERSION }}-min${{ env.MACOSX_DEPLOYMENT_TARGET }}
          path: |
            ${{ runner.temp }}/Qt
            src/boost_1_85_0
            src/svgpp-1.3.1
            src/libgit2-1.7.1
            src/quazip-${{ env.QT_VERSION }}-1.4intuisphere
            src/Clipper1-6.4.2
            src/ngspice-42
            src/source-archives.sha256

      - name: Configure Qt paths
        run: |
          echo "$RUNNER_TEMP/Qt/$QT_VERSION/macos/bin" >> "$GITHUB_PATH"
          echo "QT_ROOT=$RUNNER_TEMP/Qt/$QT_VERSION/macos" >> "$GITHUB_ENV"

      - name: Install a fixed Qt toolchain
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install 'aqtinstall==3.3.0'
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac desktop "$QT_VERSION" clang_64 \
            --outputdir "$RUNNER_TEMP/Qt" \
            --modules qt5compat qtserialport qtimageformats

      - name: Fetch dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          set -euo pipefail
          fetch_commit() {
            local url="$1" commit="$2" dest="$3"
            git init -q "$dest"
            git -C "$dest" remote add origin "$url"
            git -C "$dest" fetch --depth 1 origin "$commit"
            git -C "$dest" checkout --detach FETCH_HEAD
            test "$(git -C "$dest" rev-parse HEAD)" = "$commit"
          }
          fetch_commit https://github.com/libgit2/libgit2.git \
            a2bde63741977ca0f4ef7db2f609df320be67a08 libgit2-source
          fetch_commit https://github.com/stachenov/quazip.git \
            566fa496649b8cb09018b497575bb3bf2977965f quazip-source
          fetch_commit https://github.com/svgpp/svgpp.git \
            fda1fd889548289178261d7aa02dd5d647247f94 svgpp-1.3.1
          fetch_commit https://github.com/skyrpex/clipper.git \
            b1f1e1672745c1e1d73dd0437d1643f9633e7508 clipper-source
          curl --fail --location --retry 3 --max-time 300 \
            https://archives.boost.io/release/1.85.0/source/boost_1_85_0.tar.bz2 \
            --output boost.tar.bz2
          echo "7009fe1faa1697476bdc7027703a2badb84e849b7b0baad5086b087b971f8617  boost.tar.bz2" | shasum -a 256 -c -
          tar -xjf boost.tar.bz2
          curl --fail --location --retry 3 --max-time 300 \
            https://downloads.sourceforge.net/project/ngspice/ng-spice-rework/old-releases/42/ngspice-42.tar.gz \
            --output ngspice.tar.gz
          mkdir ngspice-source
          tar -xzf ngspice.tar.gz --strip-components=1 -C ngspice-source
          shasum -a 256 boost.tar.bz2 ngspice.tar.gz > source-archives.sha256

      - name: Build native dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          set -euo pipefail
          root="$PWD"
          common=(-DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
            "-DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5)
          cmake -S libgit2-source -B libgit2-build "${common[@]}" \
            "-DCMAKE_INSTALL_PREFIX=$root/libgit2-1.7.1" \
            -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF \
            -DBUILD_CLI=OFF -DUSE_SSH=OFF -DUSE_HTTPS=SecureTransport \
            -DUSE_BUNDLED_ZLIB=OFF -DREGEX_BACKEND=builtin
          cmake --build libgit2-build
          cmake --install libgit2-build
          quazip_prefix="$root/quazip-$QT_VERSION-1.4intuisphere"
          cmake -S quazip-source -B quazip-build "${common[@]}" \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT" "-DCMAKE_INSTALL_PREFIX=$quazip_prefix" \
            -DCMAKE_INSTALL_LIBDIR=lib -DQUAZIP_QT_MAJOR_VERSION=6 \
            -DQUAZIP_BZIP2=OFF -DQUAZIP_ENABLE_TESTS=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build quazip-build
          cmake --install quazip-build
          cmake -S clipper-source/cpp -B clipper-build "${common[@]}" \
            "-DCMAKE_INSTALL_PREFIX=$root/Clipper1-6.4.2" -DBUILD_SHARED_LIBS=ON
          cmake --build clipper-build
          cmake --install clipper-build
          cd ngspice-source
          CFLAGS='-O2 -arch arm64 -Wno-error=implicit-function-declaration -Wno-error=incompatible-function-pointer-types' \
            LDFLAGS='-arch arm64' ./configure \
            --prefix="$root/ngspice-42" --with-ngshared --enable-xspice \
            --enable-cider --enable-relpath --disable-debug \
            --without-x --with-readline=no
          make -j3
          make install

      - name: Save compiled dependencies before building the app
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          key: ${{ steps.deps.outputs.cache-primary-key }}
          path: |
            ${{ runner.temp }}/Qt
            src/boost_1_85_0
            src/svgpp-1.3.1
            src/libgit2-1.7.1
            src/quazip-${{ env.QT_VERSION }}-1.4intuisphere
            src/Clipper1-6.4.2
            src/ngspice-42
            src/source-archives.sha256

      - name: Make CI dialogs fail with their diagnostic text
        working-directory: src/fritzing-app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/utils/fmessagebox.cpp")
          source = path.read_text()
          anchor = "\tlogMessage(level + \": \" % title, aggregatedText);"
          if source.count(anchor) != 1:
              raise SystemExit("Unexpected FMessageBox source; refusing to patch")
          replacement = anchor + """
              // CI database generation must report errors instead of opening modal dialogs.
              // The environment switch is unset during normal application use.
              if (qEnvironmentVariableIsSet("FRITZING_CI_FAIL_ON_DIALOG")) {
                  const QString diagnostic = level + ": " + title + "\n"
                      + "Text: " + text + "\n"
                      + "Informative Text: " + informativeText + "\n"
                      + "Detailed Text: " + detailedText;
                  qFatal("%s", qPrintable(diagnostic));
              }
          """
          path.write_text(source.replace(anchor, replacement))
          PY
          git diff --check
          git diff -- src/utils/fmessagebox.cpp

      - name: Build Fritzing as ARM64 only
        working-directory: src/fritzing-app
        run: |
          set -euo pipefail
          test "$(qmake -query QT_VERSION)" = "$QT_VERSION"
          qmake phoenix.pro "boost_root=$PWD/../boost_1_85_0" \
            'CONFIG-=debug_and_release' 'CONFIG+=release' \
            -after 'QMAKE_APPLE_DEVICE_ARCHS=arm64' \
            "QMAKE_MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
          make -j3
          lipo ../release64/Fritzing.app/Contents/MacOS/Fritzing -verify_arch arm64
          lrelease phoenix.pro

      - name: Bundle runtime, parts and resources
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto src/release64/Fritzing.app dist/Fritzing.app
          support="$PWD/dist/Fritzing.app/Contents/MacOS"
          for item in sketches help translations; do
            ditto "src/fritzing-app/$item" "$support/$item"
          done
          cp src/fritzing-app/INSTALL.txt src/fritzing-app/README.md src/fritzing-app/LICENSE* "$support/"
          find "$support/translations" -name '*.ts' -delete
          ditto src/fritzing-parts "$support/fritzing-parts"
          mkdir -p dist/Fritzing.app/Contents/lib/ngspice
          cp -L src/ngspice-42/lib/libngspice.0.dylib dist/Fritzing.app/Contents/lib/
          cp -L src/ngspice-42/lib/ngspice/*.cm dist/Fritzing.app/Contents/lib/ngspice/
          # Only SQLite is needed; other SQL plugins require external runtimes.
          test -f "$QT_ROOT/plugins/sqldrivers/libqsqlite.dylib"
          find "$QT_ROOT/plugins/sqldrivers" \
            -type f -name '*.dylib' ! -name 'libqsqlite.dylib' -delete
          # Scan a bundled copy of QuaZip, including its QtCore5Compat dependency.
          mkdir -p dist/Fritzing.app/Contents/Frameworks
          quazip="$PWD/dist/Fritzing.app/Contents/Frameworks/libquazip1-qt6.1.4.0.dylib"
          cp -L "src/quazip-$QT_VERSION-1.4intuisphere/lib/libquazip1-qt6.dylib" "$quazip"
          # macdeployqt normally selects Cocoa only. Include offscreen explicitly.
          offscreen="$PWD/dist/Fritzing.app/Contents/PlugIns/platforms/libqoffscreen.dylib"
          test -f "$QT_ROOT/plugins/platforms/libqoffscreen.dylib"
          mkdir -p "$(dirname "$offscreen")"
          cp -L "$QT_ROOT/plugins/platforms/libqoffscreen.dylib" "$offscreen"
          macdeployqt dist/Fritzing.app -verbose=2 -always-overwrite \
            "-executable=$offscreen" \
            "-executable=$quazip" \
            "-executable=$PWD/dist/Fritzing.app/Contents/lib/libngspice.0.dylib" \
            "-libpath=$PWD/src/quazip-$QT_VERSION-1.4intuisphere/lib" \
            "-libpath=$PWD/src/Clipper1-6.4.2/lib"
          test -f dist/Fritzing.app/Contents/Frameworks/QtCore5Compat.framework/Versions/A/QtCore5Compat
          # Keep the parts Git metadata until database generation: Fritzing reads its SHA.
          # Run without a GUI and bound execution even if an application dialog blocks.
          export FRITZING_SUPPORT="$support"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import signal
          import subprocess
          import time

          support = Path(os.environ["FRITZING_SUPPORT"])
          logs = Path("dist/diagnostics")
          logs.mkdir(parents=True, exist_ok=True)
          env = os.environ.copy()
          env["QT_QPA_PLATFORM"] = "offscreen"
          env["QT_DEBUG_PLUGINS"] = "1"
          env["FRITZING_CI_FAIL_ON_DIALOG"] = "1"
          command = [
              str(support / "Fritzing"), "--noopengl",
              "-d", str(logs.resolve() / "fritzing-debug.log"),
              "-f", str(support), "-parts", str(support / "fritzing-parts"),
              "-db", str(support / "fritzing-parts/parts.db"),
          ]
          started = time.monotonic()
          with (logs / "fritzing-console.log").open("w") as output:
              process = subprocess.Popen(
                  command, env=env, stdout=output,
                  stderr=subprocess.STDOUT, start_new_session=True,
              )
              try:
                  while True:
                      try:
                          code = process.wait(timeout=30)
                          break
                      except subprocess.TimeoutExpired:
                          elapsed = int(time.monotonic() - started)
                          print(f"Generating parts database: {elapsed}s elapsed", flush=True)
                          if elapsed >= 600:
                              subprocess.run(
                                  ["sample", str(process.pid), "5", "-file",
                                   str(logs / "fritzing-sample.txt")],
                                  timeout=15, check=False,
                              )
                              raise TimeoutError("Database generation exceeded 600 seconds")
              except BaseException:
                  os.killpg(process.pid, signal.SIGKILL)
                  process.wait()
                  raise
              finally:
                  for path in sorted(logs.glob("*.log")):
                      print(f"--- {path.name} (last 120 lines) ---", flush=True)
                      print("\n".join(path.read_text(errors="replace").splitlines()[-120:]))
          if code:
              raise SystemExit(code)
          PY
          test -s "$support/fritzing-parts/parts.db"
          sqlite3 "$support/fritzing-parts/parts.db" 'PRAGMA integrity_check;' | grep -x ok
          rm -rf "$support/fritzing-parts/.git"
          {
            echo "Fritzing: $(git -C src/fritzing-app rev-parse HEAD)"
            echo "Parts: $(git -C src/fritzing-parts rev-parse HEAD)"
            echo "Local patch: CI-only fail-fast diagnostic hook in FMessageBox::exec"
            echo "Qt: $QT_VERSION; architecture: arm64; minimum macOS: $MACOSX_DEPLOYMENT_TARGET"
            echo "Parts patch: repair 30 duplicate Nano replacement attributes; validate XML"
            cat src/source-archives.sha256
          } > dist/BUILD-INFO.txt

      - name: Audit, ad-hoc sign and archive
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for path in Path('dist/Fritzing.app').rglob('*'):
              if not path.is_file() or path.is_symlink():
                  continue
              kind = subprocess.check_output(['file', '-b', str(path)], text=True)
              if 'Mach-O' not in kind:
                  continue
              subprocess.run(['lipo', str(path), '-verify_arch', 'arm64'], check=True)
              deps = subprocess.check_output(['otool', '-L', str(path)], text=True)
              for line in deps.splitlines()[1:]:
                  dep = line.strip().split(' (', 1)[0]
                  if dep.startswith('/') and not dep.startswith(('/usr/lib/', '/System/Library/')):
                      # A library's own install ID is not a dependency.
                      ids = subprocess.check_output(['otool', '-D', str(path)], text=True).splitlines()[1:]
                      if dep not in ids:
                          raise SystemExit(f'Unbundled dependency in {path}: {dep}')
          PY
          codesign --force --deep --sign - dist/Fritzing.app
          codesign --verify --deep --strict --verbose=2 dist/Fritzing.app
          ditto -c -k --sequesterRsrc --keepParent dist/Fritzing.app dist/Fritzing-macos-arm64.zip
          shasum -a 256 dist/Fritzing-macos-arm64.zip > dist/Fritzing-macos-arm64.zip.sha256
          {
            echo '## Fritzing for Apple Silicon'
            echo 'Download the Fritzing-macos-arm64 artifact below and extract the app ZIP.'
            echo 'Built for macOS 14 or newer. Ad-hoc signed; not Apple notarized.'
            echo 'If Gatekeeper blocks the trusted build, use System Settings → Privacy & Security → Open Anyway.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Fritzing-diagnostics
          path: dist/diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Fritzing-macos-arm64
          path: |
            dist/Fritzing-macos-arm64.zip
            dist/Fritzing-macos-arm64.zip.sha256
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
